<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-secondary);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -1px;
    }

    .auth-logo h1 span { color: var(--accent); }

    .auth-box {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .auth-box h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
    }

    .auth-box p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .auth-footer a { color: var(--accent); font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }

    .error-msg {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">
      <h1>Gosu<span>Core</span></h1>
    </div>

    <div class="auth-box">
      <h2>Đăng nhập</h2>
      <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="ten@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="handleLogin()">
        Đăng nhập
      </button>

      <div class="divider">hoặc</div>

      <a href="index.html" class="btn btn-light btn-full">
        Tiếp tục mua sắm không cần đăng nhập
      </a>
    </div>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a href="register.html">Đăng ký ngay</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Nếu đã đăng nhập rồi thì redirect
    if (isLoggedIn()) window.location.href = 'index.html';

    // Enter để đăng nhập
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    const handleLogin = async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errorEl  = document.getElementById('error-msg');

      if (!email || !password) {
        showError('Vui lòng nhập email và mật khẩu.');
        return;
      }

      btn.textContent = 'Đang đăng nhập...';
      btn.disabled = true;
      errorEl.classList.remove('show');

      try {
        const data = await api.post('/auth/login', { email, password });

        // Lưu token và user info
        localStorage.setItem('gosucore_token', data.token);
        localStorage.setItem('gosucore_user', JSON.stringify(data.user));

        // Redirect theo role
        if (data.user.role === 'manager' || data.user.role === 'staff') {
          window.location.href = '../admin/index.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        showError(err.message || 'Đăng nhập thất bại.');
        btn.textContent = 'Đăng nhập';
        btn.disabled = false;
      }
    };

    const showError = (msg) => {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    };
  </script>
</body>
</html>
