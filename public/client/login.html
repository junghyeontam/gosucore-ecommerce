<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/client/login.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">
      <h1>Gosu<span>Core</span></h1>
    </div>

    <div class="auth-box">
      <h2>Đăng nhập</h2>
      <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="ten@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="handleLogin()">
        Đăng nhập
      </button>

      <div class="divider">hoặc</div>

      <a href="index.html" class="btn btn-light btn-full">
        Tiếp tục mua sắm không cần đăng nhập
      </a>
    </div>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a href="register.html">Đăng ký ngay</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/client/login.js"></script>
</body>
</html>
