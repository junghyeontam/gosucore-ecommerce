<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .product-detail {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 5%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .product-img-wrap {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      position: sticky;
      top: 80px;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info { padding-top: 1rem; }

    .product-brand {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .product-rating-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-light);
    }

    .product-avg-rating {
      font-size: 1rem;
      font-weight: 700;
      color: var(--warning);
    }

    .product-price-section {
      margin-bottom: 1.5rem;
    }

    .product-price-big {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -1px;
    }

    .product-stock-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
    }

    .product-stock-info.low { color: var(--danger); }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .qty-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      font-weight: 600;
    }

    .qty-btn:hover { background: var(--border); }

    .qty-value {
      font-size: 1.1rem;
      font-weight: 700;
      min-width: 30px;
      text-align: center;
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .specs-section {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-light);
    }

    .specs-section h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .spec-item {
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
    }

    .spec-key {
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.2rem;
    }

    .spec-value {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* COMBO SECTION */
    .combo-section {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .combo-section h3 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .combo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 0.5rem;
    }

    .combo-item:hover { box-shadow: var(--shadow-sm); }

    .combo-item img {
      width: 50px; height: 50px;
      object-fit: contain;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 0.25rem;
    }

    .combo-info { flex: 1; }

    .combo-name {
      font-size: 0.83rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .combo-discount {
      font-size: 0.75rem;
      color: var(--success);
      font-weight: 600;
    }

    /* REVIEWS */
    .reviews-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 5% 4rem;
    }

    .reviews-section h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }

    .rating-overview {
      display: flex;
      align-items: center;
      gap: 3rem;
      padding: 2rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
    }

    .rating-big {
      text-align: center;
    }

    .rating-big .num {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
    }

    .rating-big .stars { font-size: 1.2rem; }

    .rating-big p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
    }

    .rating-bars { flex: 1; }

    .rating-bar-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .rating-bar-item span:first-child {
      font-size: 0.78rem;
      color: var(--text-secondary);
      width: 35px;
      text-align: right;
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--warning);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .review-card {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border-light);
    }

    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .reviewer-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .review-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .review-comment {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-top: 0.4rem;
    }

    .breadcrumb {
      padding: 1rem 5%;
      font-size: 0.83rem;
      color: var(--text-secondary);
      max-width: 1100px;
      margin: 0 auto;
    }

    .breadcrumb a { color: var(--accent); }
    .breadcrumb a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .product-detail {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .product-img-wrap { position: static; aspect-ratio: 4/3; }
      .specs-grid { grid-template-columns: 1fr; }
      .rating-overview { flex-direction: column; gap: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">Gosu<span style="color:var(--accent)">Core</span></a>
    <div class="navbar-menu">
      <a href="index.html">Cửa Hàng</a>
      <a href="orders.html">Đơn hàng</a>
    </div>
    <div class="navbar-actions">
      <div class="navbar-icon cart-icon" onclick="window.location.href='cart.html'">
        🛒<span class="cart-count">0</span>
      </div>
      <div id="auth-area"></div>
    </div>
  </nav>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <a href="index.html">Cửa hàng</a> › <span id="breadcrumb-name">Đang tải...</span>
  </div>

  <!-- PRODUCT DETAIL -->
  <div class="product-detail" id="product-detail">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <!-- REVIEWS -->
  <div class="reviews-section" id="reviews-section" style="display:none">
    <h2>Đánh giá từ khách hàng</h2>
    <div class="rating-overview" id="rating-overview"></div>
    <div id="reviews-list"></div>
    <div id="review-form-section"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const params    = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    let quantity    = 1;
    let product     = null;

    if (!productId) window.location.href = 'index.html';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadProduct();
      await loadReviews();
    });

    const loadProduct = async () => {
      try {
        const data = await api.get(`/products/${productId}`);
        product = data.data;

        document.title = `${product.name} - GosuCore`;
        document.getElementById('breadcrumb-name').textContent = product.name;

        renderProduct(product);
      } catch (e) {
        document.getElementById('product-detail').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h3>Không tìm thấy sản phẩm</h3>
            <a href="index.html" class="btn btn-primary" style="margin-top:1rem">Về trang chủ</a>
          </div>`;
      }
    };

    const renderProduct = (p) => {
      const specs = p.specs ? JSON.parse(p.specs) : {};
      const specLabels = {
        sensor: 'Cảm biến', dpi_max: 'DPI tối đa', dpi_min: 'DPI tối thiểu',
        buttons: 'Số nút', wireless: 'Không dây', battery_hours: 'Pin (giờ)',
        weight: 'Trọng lượng', rgb: 'RGB', connection: 'Kết nối',
        switch: 'Switch', layout: 'Layout', polling_rate: 'Polling Rate',
        driver: 'Driver', surround: 'Âm thanh', mic: 'Micro',
        size: 'Kích thước', resolution: 'Độ phân giải', panel: 'Tấm nền',
        refresh_rate: 'Tần số quét', response_time: 'Thời gian phản hồi',
        surface: 'Bề mặt', material: 'Chất liệu', max_load: 'Tải trọng',
        recline: 'Góc ngả', warranty: 'Bảo hành',
      };

      const specsHTML = Object.entries(specs).map(([k, v]) => `
        <div class="spec-item">
          <div class="spec-key">${specLabels[k] || k}</div>
          <div class="spec-value">${v === true ? '✅ Có' : v === false ? '❌ Không' : v}</div>
        </div>`).join('');

      const combosHTML = p.combos && p.combos.length > 0 ? `
        <div class="combo-section">
          <h3>🎁 Mua kèm được giảm giá</h3>
          ${p.combos.map(c => `
            <div class="combo-item" onclick="window.location.href='product.html?id=${c.id}'">
              <img src="${c.image_url}" alt="${c.name}"
                   onerror="this.src='https://placehold.co/50x50/f5f5f7/999?text=IMG'">
              <div class="combo-info">
                <div class="combo-name">${c.name}</div>
                <div class="combo-discount">Giảm ${c.discount_percent}% khi mua kèm</div>
              </div>
              <div style="font-weight:700;font-size:0.875rem">${formatPrice(c.price)}</div>
            </div>`).join('')}
        </div>` : '';

      document.getElementById('product-detail').innerHTML = `
        <div class="product-img-wrap">
          <img src="${p.image_url || 'https://placehold.co/400x400/f5f5f7/999?text=No+Image'}"
               alt="${p.name}"
               onerror="this.src='https://placehold.co/400x400/f5f5f7/999?text=No+Image'">
        </div>
        <div class="product-info">
          <div class="product-brand">${p.brand || ''}</div>
          <h1 class="product-title">${p.name}</h1>
          <div class="product-rating-row">
            <span class="stars">${renderStars(p.avg_rating)}</span>
            <span class="product-avg-rating">${Number(p.avg_rating).toFixed(1)}</span>
            <span style="color:var(--text-muted);font-size:0.85rem">(${p.review_count} đánh giá)</span>
          </div>
          <div class="product-price-section">
            <div class="product-price-big">${formatPrice(p.price)}</div>
            <div class="product-stock-info ${p.stock <= 5 ? 'low' : ''}">
              ${p.stock <= 0 ? '❌ Hết hàng' : p.stock <= 5 ? `⚠️ Chỉ còn ${p.stock} sản phẩm` : `✅ Còn hàng (${p.stock} sản phẩm)`}
            </div>
          </div>

          ${p.description ? `<p style="color:var(--text-secondary);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem">${p.description}</p>` : ''}

          <div class="quantity-control">
            <span style="font-size:0.85rem;font-weight:500;color:var(--text-secondary)">Số lượng:</span>
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-value" id="qty-display">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>

          <div class="product-actions">
            <button class="btn btn-dark btn-full btn-lg" onclick="addToCart()" ${p.stock <= 0 ? 'disabled' : ''}>
              ${p.stock <= 0 ? 'Hết hàng' : '🛒 Thêm vào giỏ hàng'}
            </button>
            <button class="btn btn-primary btn-full btn-lg" onclick="buyNow()" ${p.stock <= 0 ? 'disabled' : ''}>
              Mua ngay
            </button>
          </div>

          ${specsHTML ? `
            <div class="specs-section">
              <h3>Thông số kỹ thuật</h3>
              <div class="specs-grid">${specsHTML}</div>
            </div>` : ''}

          ${combosHTML}
        </div>`;
    };

    const changeQty = (delta) => {
      quantity = Math.max(1, Math.min(product.stock, quantity + delta));
      document.getElementById('qty-display').textContent = quantity;
    };

    const addToCart = () => {
      if (!product) return;
      cart.add(product, quantity);
      cart.updateCount();
    };

    const buyNow = () => {
      if (!product) return;
      cart.add(product, quantity);
      cart.updateCount();
      window.location.href = 'cart.html';
    };

    // Load reviews
    const loadReviews = async () => {
      try {
        const data = await api.get(`/reviews/${productId}`);
        const { stats, data: reviews } = data;

        document.getElementById('reviews-section').style.display = 'block';

        // Rating overview
        const total = stats.total_reviews;
        document.getElementById('rating-overview').innerHTML = `
          <div class="rating-big">
            <div class="num">${Number(stats.avg_rating).toFixed(1)}</div>
            <div class="stars">${renderStars(stats.avg_rating)}</div>
            <p>${total} đánh giá</p>
          </div>
          <div class="rating-bars">
            ${[5,4,3,2,1].map(star => {
              const count = stats[`star_${star}`] || 0;
              const pct   = total > 0 ? (count / total * 100) : 0;
              return `
                <div class="rating-bar-item">
                  <span>${star} ★</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%"></div>
                  </div>
                  <span style="font-size:0.75rem;color:var(--text-muted);width:25px">${count}</span>
                </div>`;
            }).join('')}
          </div>`;

        // Reviews list
        if (reviews.length === 0) {
          document.getElementById('reviews-list').innerHTML = `
            <div style="color:var(--text-secondary);font-size:0.875rem;padding:1rem 0">
              Chưa có đánh giá nào. Hãy là người đầu tiên!
            </div>`;
        } else {
          document.getElementById('reviews-list').innerHTML =
            reviews.map(r => `
              <div class="review-card">
                <div class="review-header">
                  <div>
                    <span class="reviewer-name">${r.full_name || r.username}</span>
                    <span class="stars" style="margin-left:0.5rem">${renderStars(r.rating)}</span>
                  </div>
                  <span class="review-date">${formatDate(r.created_at)}</span>
                </div>
                ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ''}
              </div>`).join('');
        }

        // Form viết review (nếu đã đăng nhập)
        if (isLoggedIn()) {
          document.getElementById('review-form-section').innerHTML = `
            <div style="margin-top:2rem;padding-top:2rem;border-top:1px solid var(--border-light)">
              <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem">Viết đánh giá của bạn</h3>
              <div style="display:flex;gap:0.5rem;margin-bottom:1rem" id="star-select">
                ${[1,2,3,4,5].map(s => `
                  <span style="font-size:1.8rem;cursor:pointer;color:var(--border)"
                    onmouseover="hoverStar(${s})"
                    onmouseout="resetStars()"
                    onclick="selectStar(${s})"
                    data-star="${s}">★</span>`).join('')}
              </div>
              <div class="form-group">
                <textarea id="review-comment" placeholder="Chia sẻ trải nghiệm của bạn về sản phẩm này..." rows="3"></textarea>
              </div>
              <button class="btn btn-primary" onclick="submitReview()">Gửi đánh giá</button>
            </div>`;
        }

      } catch (e) {
        console.error('Lỗi load reviews:', e);
      }
    };

    let selectedStar = 0;

    const hoverStar = (n) => {
      document.querySelectorAll('#star-select span').forEach((el, i) => {
        el.style.color = i < n ? 'var(--warning)' : 'var(--border)';
      });
    };

    const resetStars = () => {
      document.querySelectorAll('#star-select span').forEach((el, i) => {
        el.style.color = i < selectedStar ? 'var(--warning)' : 'var(--border)';
      });
    };

    const selectStar = (n) => {
      selectedStar = n;
      resetStars();
    };

    const submitReview = async () => {
      if (!selectedStar) {
        toast.error('Vui lòng chọn số sao!');
        return;
      }

      const comment = document.getElementById('review-comment').value;

      try {
        await api.post('/reviews', {
          product_id: parseInt(productId),
          rating: selectedStar,
          comment,
        });
        toast.success('Đánh giá của bạn đã được gửi!');
        setTimeout(() => location.reload(), 1500);
      } catch (e) {
        toast.error(e.message);
      }
    };
  </script>
</body>
</html>
