<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/client/orders.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">Gosu<span style="color:var(--accent)">Core</span></a>
    <div class="navbar-menu">
      <a href="index.html">Cửa Hàng</a>
      <a href="orders.html" style="color:var(--accent)">Đơn hàng</a>
    </div>
    <div class="navbar-actions">
      <div class="navbar-icon cart-icon" onclick="window.location.href='cart.html'">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h8.76a2 2 0 0 0 1.95-1.57L21 8H5.12"/></svg><span class="cart-count">0</span>
      </div>
      <div id="auth-area"></div>
    </div>
  </nav>

  <!-- CANCEL CONFIRM MODAL -->
  <div class="cancel-overlay" id="cancel-overlay">
    <div class="cancel-modal">
      <div class="cancel-modal-icon">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </div>
      <h3>Hủy đơn hàng?</h3>
      <p id="cancel-modal-desc">Bạn có chắc muốn hủy đơn hàng này không?</p>
      <div class="cancel-modal-actions">
        <button class="btn-keep" onclick="closeCancelModal()">Giữ đơn</button>
        <button class="btn-do-cancel" id="cancel-confirm-btn" onclick="doCancel()">Hủy đơn hàng</button>
      </div>
    </div>
  </div>

  <div class="orders-page">
    <h1>Đơn hàng của tôi</h1>
    <p>Theo dõi và quản lý tất cả đơn hàng của bạn.</p>

    <div class="filter-tabs">
      <div class="filter-tab active" onclick="filterOrders(null, this)">Tất cả</div>
      <div class="filter-tab" onclick="filterOrders('pending',   this)"><svg viewBox="0 0 24 24"><path d="M6 2h12"/><path d="M6 22h12"/><path d="M8 2v5a4 4 0 0 0 8 0V2"/><path d="M8 22v-5a4 4 0 0 1 8 0v5"/></svg>Chờ xác nhận</div>
      <div class="filter-tab" onclick="filterOrders('confirmed', this)"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Đã xác nhận</div>
      <div class="filter-tab" onclick="filterOrders('shipping',  this)"><svg viewBox="0 0 24 24"><path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Đang giao</div>
      <div class="filter-tab" onclick="filterOrders('done',      this)"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="m17 5-5-3-5 3"/><path d="M5 12h14"/><path d="m7 19 5 3 5-3"/></svg>Hoàn thành</div>
      <div class="filter-tab" onclick="filterOrders('cancelled', this)"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Đã hủy</div>
    </div>

    <div id="orders-container">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/client/orders.js"></script>
</body>
</html>
