<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/client/cart.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">Gosu<span style="color:var(--accent)">Core</span></a>
    <div class="navbar-menu">
      <a href="index.html">Cửa Hàng</a>
      <a href="orders.html">Đơn hàng</a>
    </div>
    <div class="navbar-actions">
      <div class="navbar-icon cart-icon" onclick="window.location.href='cart.html'">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h8.76a2 2 0 0 0 1.95-1.57L21 8H5.12"/></svg><span class="cart-count">0</span>
      </div>
      <div id="auth-area"></div>
    </div>
  </nav>

  <div class="cart-header">
    <h1>Giỏ hàng</h1>
    <p id="cart-summary-text"></p>
  </div>

  <div class="cart-page">
    <!-- CART ITEMS -->
    <div id="cart-items-container"></div>

    <!-- ORDER SUMMARY -->
    <div class="order-summary">
      <h2>Tóm tắt đơn hàng</h2>

      <div class="summary-row">
        <span class="label">Tạm tính</span>
        <span class="value" id="subtotal">0₫</span>
      </div>

      <div class="summary-row" id="discount-row" style="display:none">
        <span class="label" style="color:var(--success)">Giảm giá</span>
        <span class="value" style="color:var(--success)" id="discount-amount">-0₫</span>
      </div>

      <div class="summary-row">
        <span class="label">Vận chuyển</span>
        <span class="value" id="shipping-fee">Miễn phí</span>
      </div>

      <div class="summary-row total">
        <span class="label">Tổng cộng</span>
        <span class="value" id="total-price">0₫</span>
      </div>

      <!-- VOUCHER -->
      <div style="margin-top:1rem">
        <div style="font-size:0.83rem;font-weight:600;margin-bottom:0.5rem">Mã giảm giá</div>
        <div class="voucher-input">
          <input type="text" id="voucher-code" placeholder="Nhập mã..." maxlength="20">
          <button class="btn btn-outline btn-sm" onclick="applyVoucher()">Áp dụng</button>
        </div>
        <div class="voucher-result" id="voucher-result"></div>
      </div>

      <button class="btn btn-dark btn-full btn-lg" onclick="goCheckout()" id="checkout-btn">
        Tiến hành thanh toán
      </button>

      <a href="index.html" style="display:block;text-align:center;margin-top:1rem;font-size:0.83rem;color:var(--accent)">
        Tiếp tục mua sắm
      </a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/client/cart.js"></script>
</body>
</html>
