<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - GosuCore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/client/register.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">
      <h1>Gosu<span>Core</span></h1>
    </div>

    <div class="auth-box">
      <h2>Tạo tài khoản</h2>
      <p>Đăng ký để mua sắm thiết bị gaming chính hãng.</p>

      <div class="error-msg"   id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <div class="form-row">
        <div class="form-group">
          <label>Username *</label>
          <input type="text" id="username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="full_name" placeholder="Nguyễn Văn A">
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="ten@email.com">
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="phone" placeholder="0901234567">
      </div>

      <div class="form-group">
        <label>Mật khẩu *</label>
        <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
      </div>

      <div class="form-group">
        <label>Xác nhận mật khẩu *</label>
        <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu">
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="register-btn" onclick="handleRegister()">
        Tạo tài khoản
      </button>
    </div>

    <div class="auth-footer">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/client/register.js"></script>
</body>
</html>
