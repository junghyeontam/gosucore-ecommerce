<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Voucher - GosuCore Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-text">Gosu<span>Core</span></div>
        <span class="sidebar-logo-sub">Admin Panel</span>
      </div>
    </div>

    <div class="sidebar-section">Tổng quan</div>
    <a href="index.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>

    <div class="sidebar-section">Quản lý</div>
    <a href="products.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Sản phẩm
    </a>
    <a href="orders.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Đơn hàng
    </a>
    <a href="users.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Tài khoản
    </a>
    <a href="categories.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 17h7M17.5 14v7"/></svg>
      Danh mục
    </a>
    <a href="vouchers.html" class="sidebar-item active">
      <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      Voucher
    </a>

    <div class="sidebar-section">Hệ thống</div>
    <a href="../client/index.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Xem trang web
    </a>
    <div class="sidebar-item" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Đăng xuất
    </div>

    <div class="sidebar-footer">
      <div class="admin-user-card">
        <div class="admin-avatar" id="admin-avatar">A</div>
        <div>
          <div class="admin-user-name" id="admin-name">Admin</div>
          <div class="admin-user-role" id="admin-role">Manager</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-left">
        <h2>Quản lý Voucher</h2>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Tạo voucher</button>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Mã voucher</th>
              <th>Giảm giá</th>
              <th>Lượt dùng</th>
              <th>Hết hạn</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="vouchers-table">
            <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-3)">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL TẠO VOUCHER -->
<div class="modal-overlay" id="voucher-modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3 id="modal-title">Tạo voucher mới</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Mã voucher *</label>
      <input type="text" id="v-code" placeholder="GOSU10" style="text-transform:uppercase">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Giảm giá (%) *</label>
        <input type="number" id="v-discount" placeholder="10" min="1" max="100">
      </div>
      <div class="form-group">
        <label>Số lượt tối đa</label>
        <input type="number" id="v-maxuses" placeholder="100" min="1">
      </div>
    </div>
    <div class="form-group">
      <label>Ngày hết hạn</label>
      <input type="date" id="v-expires">
    </div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem">
      <button class="btn btn-light" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveVoucher()">Tạo voucher</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (!isLoggedIn() || !['manager','staff'].includes(getUser()?.role)) {
    window.location.href = '../client/login.html';
  }

  const user = getUser();
  if (user) {
    document.getElementById('admin-name').textContent   = user.full_name || user.username;
    document.getElementById('admin-role').textContent   = user.role === 'manager' ? 'Quản lý' : 'Nhân viên';
    document.getElementById('admin-avatar').textContent = (user.full_name || user.username)[0].toUpperCase();
  }

  // ✅ Khai báo hàm TRƯỚC
  const loadVouchers = async () => {
    const tbody = document.getElementById('vouchers-table');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-3)">Đang tải...</td></tr>';

    try {
      const data     = await api.get('/vouchers');
      const vouchers = data.data;

      if (vouchers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-3)">Chưa có voucher nào</td></tr>';
        return;
      }

      tbody.innerHTML = vouchers.map(v => {
        const pct       = v.max_uses > 0 ? Math.round((v.used_count / v.max_uses) * 100) : 0;
        const isExpired = v.expires_at && new Date(v.expires_at) < new Date();
        const isActive  = v.is_active && !isExpired;

        return `
          <tr>
            <td><span class="voucher-code">${v.code}</span></td>
            <td>
              <span style="font-size:15px;font-weight:700;color:var(--accent)">${v.discount_percent}%</span>
            </td>
            <td>
              <div style="font-size:13px;margin-bottom:4px">${v.used_count} / ${v.max_uses}</div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${pct}%"></div>
              </div>
            </td>
            <td style="font-size:12px;color:var(--text-2)">
              ${v.expires_at
                ? (isExpired
                    ? `<span style="color:var(--red)">Hết hạn ${formatDate(v.expires_at)}</span>`
                    : formatDate(v.expires_at))
                : '∞ Không giới hạn'}
            </td>
            <td>
              <span class="badge ${isActive ? 'badge-done' : 'badge-cancelled'}">
                ${isActive ? '✅ Đang dùng' : '❌ Tắt'}
              </span>
            </td>
            <td>
              <div class="action-btns">
                <button class="btn btn-outline btn-sm" onclick="toggleVoucher(${v.id}, ${v.is_active ? 1 : 0})">
                  ${v.is_active ? 'Tắt' : 'Bật'}
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteVoucher(${v.id}, '${v.code}')">🗑️</button>
              </div>
            </td>
          </tr>`;
      }).join('');

    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--red)">${e.message}</td></tr>`;
    }
  };

  // ✅ addEventListener SAU khi đã khai báo hàm
  document.addEventListener('DOMContentLoaded', loadVouchers);

  const openAddModal = () => {
    document.getElementById('modal-title').textContent = 'Tạo voucher mới';
    document.getElementById('save-btn').textContent    = 'Tạo voucher';
    document.getElementById('edit-id').value    = '';
    document.getElementById('v-code').value     = '';
    document.getElementById('v-discount').value = '';
    document.getElementById('v-maxuses').value  = '100';
    document.getElementById('v-expires').value  = '';
    document.getElementById('voucher-modal').classList.add('active');
  };

  const closeModal = () => {
    document.getElementById('voucher-modal').classList.remove('active');
  };

  const saveVoucher = async () => {
    const code     = document.getElementById('v-code').value.trim().toUpperCase();
    const discount = document.getElementById('v-discount').value;
    const maxuses  = document.getElementById('v-maxuses').value;
    const expires  = document.getElementById('v-expires').value;
    const btn      = document.getElementById('save-btn');

    if (!code || !discount) {
      toast.error('Vui lòng nhập mã và % giảm giá!');
      return;
    }

    btn.textContent = 'Đang lưu...';
    btn.disabled    = true;

    try {
      await api.post('/vouchers', {
        code,
        discount_percent: parseInt(discount),
        max_uses:         parseInt(maxuses) || 100,
        expires_at:       expires || undefined,
      });
      toast.success('Tạo voucher thành công!');
      closeModal();
      loadVouchers();
    } catch(e) {
      toast.error(e.message);
    } finally {
      btn.textContent = 'Tạo voucher';
      btn.disabled    = false;
    }
  };

  const toggleVoucher = async (id, isActive) => {
    try {
      await api.put(`/vouchers/${id}`, { is_active: !isActive });
      toast.success(isActive ? 'Đã tắt voucher!' : 'Đã bật voucher!');
      loadVouchers();
    } catch(e) {
      toast.error(e.message);
    }
  };

  const deleteVoucher = async (id, code) => {
    if (!confirm(`Xóa voucher "${code}"?`)) return;
    try {
      await api.delete(`/vouchers/${id}`);
      toast.success('Đã xóa voucher!');
      loadVouchers();
    } catch(e) {
      toast.error(e.message);
    }
  };
</script>
</body>
</html>
