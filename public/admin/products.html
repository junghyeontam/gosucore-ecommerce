<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sản phẩm — GosuCore Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32x32.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-text">Gosu<span>Core</span></div>
        <span class="sidebar-logo-sub">Admin Panel</span>
      </div>
    </div>
    <div class="sidebar-section">Tổng quan</div>
    <a href="index.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <div class="sidebar-section">Quản lý</div>
    <a href="products.html" class="sidebar-item active">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Sản phẩm
    </a>
    <a href="orders.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Đơn hàng
    </a>
    <a href="users.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Tài khoản
    </a>
    <a href="categories.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Danh mục
    </a>
    <a href="vouchers.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      Voucher
    </a>
    <div class="sidebar-section">Hệ thống</div>
    <a href="../client/index.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Xem trang web
    </a>
    <div class="sidebar-item" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Đăng xuất
    </div>
    <div class="sidebar-footer">
      <div class="admin-user-card">
        <div class="admin-avatar" id="admin-avatar">A</div>
        <div>
          <div class="admin-user-name" id="admin-name">Admin</div>
          <div class="admin-user-role" id="admin-role">Manager</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-left"><h2>Quản lý Sản phẩm</h2></div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Thêm sản phẩm
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="toolbar">
        <div class="toolbar-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search" placeholder="Tìm tên sản phẩm, hãng..." oninput="debounceSearch()">
        </div>
        <select id="filter-category" onchange="loadProducts()">
          <option value="">Tất cả danh mục</option>
        </select>
        <select id="filter-sort" onchange="loadProducts()">
          <option value="newest">Mới nhất</option>
          <option value="price_asc">Giá thấp → cao</option>
          <option value="price_desc">Giá cao → thấp</option>
        </select>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Danh mục</th>
              <th>Giá</th>
              <th>Tồn kho</th>
              <th style="width:100px">Thao tác</th>
            </tr>
          </thead>
          <tbody id="products-table">
            <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-3)">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="pagination" style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap"></div>
    </div>
  </main>
</div>

<!-- MODAL THÊM/SỬA -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Thêm sản phẩm mới</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-row">
      <div class="form-group">
        <label>Tên sản phẩm *</label>
        <input type="text" id="f-name" placeholder="Logitech G502 X Plus">
      </div>
      <div class="form-group">
        <label>Hãng</label>
        <input type="text" id="f-brand" placeholder="Logitech">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Giá (VNĐ) *</label>
        <input type="number" id="f-price" placeholder="2490000">
      </div>
      <div class="form-group">
        <label>Tồn kho *</label>
        <input type="number" id="f-stock" placeholder="50">
      </div>
    </div>
    <div class="form-group">
      <label>Danh mục *</label>
      <select id="f-category"><option value="">Chọn danh mục</option></select>
    </div>
    <div class="form-group">
      <label>Mô tả</label>
      <textarea id="f-description" rows="3" placeholder="Mô tả sản phẩm..."></textarea>
    </div>
    <div class="form-group">
      <label>URL hình ảnh</label>
      <input type="text" id="f-image" placeholder="/assets/images/ten-anh.jpg">
    </div>
    <div class="form-group">
      <label>Thông số kỹ thuật (JSON)</label>
      <textarea id="f-specs" rows="3" placeholder='{"sensor":"HERO 25K","dpi_max":25600}'></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-light" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveProduct()">Lưu sản phẩm</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="confirm-modal-overlay" id="confirm-modal">
  <div class="confirm-modal">
    <div class="confirm-modal-icon">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </div>
    <div class="confirm-modal-title">Xóa sản phẩm?</div>
    <div class="confirm-modal-desc" id="confirm-desc">Sản phẩm sẽ bị ẩn khỏi cửa hàng.</div>
    <div class="confirm-modal-actions">
      <button class="btn btn-light" onclick="closeConfirm()">Hủy</button>
      <button class="btn btn-danger" id="confirm-ok-btn">Xóa</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin/products.js"></script>
</body>
</html>
